<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 1 — Canvas Basics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Day 1 — Canvas + Draggable Node</h1>
    <p id="status">Drag the box. Value updates live.</p>
  </header>

  <!-- The canvas is our drawing surface -->
  <canvas id="canvas"></canvas>

  <!-- A control panel outside the canvas (plain HTML) -->
  <aside class="panel">
    <label>Value</label>
    <input type="number" id="valueInput" value="10" />
    <label>Color</label>
    <input type="color" id="colorInput" value="#38bdf8" />
  </aside>

  <script src="script.js"></script>
</body>
</html>
